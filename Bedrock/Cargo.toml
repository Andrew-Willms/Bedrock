[package]
name = "bedrock"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[build]
target = "wasm32-unknown-unknown"

[dependencies]
wgpu = "30.0.1"
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4.77"
web-sys = { version = "0.3.104", features = [
    "Document",
    "DomRect",
    "Element",
    "HtmlCanvasElement",
    "Window",
] }

console_error_panic_hook = { version = "0.1.7", optional = true }
console_log = { version = "1.1.0", optional = true }
log = "0.4.34"
bytemuck = "1.25.2"

[features]
debug-logging = [
    "dep:console_error_panic_hook",
    "dep:console_log",
]

#[lints.clippy]
#implicit_return = "deny"
#needless_return = "allow"